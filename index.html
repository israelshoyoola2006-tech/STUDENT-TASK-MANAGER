<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT TASK MANAGER</title>
    <link rel="stylesheet" href="TASK.css">
</head>
<body>
    <div class="container">
        <div class="todo-app"> 
            <h2>To-Do List <img src="icon.png" alt=""></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Add your text">
                <button onclick="addTask()">ENTER!!</button>
            </div>
            <div class="filters">
    <button class="ALL" onclick="filterTasks('all')">All</button>
    <button class="DONE" onclick="filterTasks('done')">Done</button>
    <button class="UNDONE" onclick="filterTasks('undone')">Undone</button>
</div>
            <ul id="list-container">
                <!-- <li class="checked">Task1</li>
                <li>Task2</li>
                <li>Task3</li> -->
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
